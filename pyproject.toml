[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
version = "1.0.0"
description = "Production-grade AI ecosystem — 20+ LLM providers, 7-role agent pipeline, 2000+ tools, advanced RAG, web dashboard, plugin system. More powerful than npmai."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "NexusAI Team"}
]
keywords = ["ai", "llm", "agents", "rag", "tools", "autonomous", "nexusai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
google = ["google-generativeai>=0.5.0"]
groq = ["groq>=0.5.0"]
mistral = ["mistralai>=0.4.0"]
cohere = ["cohere>=5.0.0"]
together = ["together>=1.0.0"]
huggingface = ["huggingface-hub>=0.20.0"]
rag = [
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
]
tools = [
    "gitpython>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]
mcp = [
    "websockets>=12.0",
]
all = [
    "nexusai[openai,anthropic,google,groq,mistral,cohere,together,huggingface,rag,web,tools,mcp]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
nexusai = "nexusai.cli:main"

[project.urls]
Homepage = "https://github.com/nexusai/nexusai"
Documentation = "https://nexusai.dev"
Repository = "https://github.com/nexusai/nexusai"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexusai*"]

[tool.ruff]
line-length = 100
target-version = "py39"
