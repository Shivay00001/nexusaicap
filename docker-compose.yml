version: '3.8'

services:
  nexusai:
    build: .
    ports:
      - "8080:8080"
      - "8765:8765"
    volumes:
      - nexusai_data:/root/.nexusai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped

volumes:
  nexusai_data:
